<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessments</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>/* One family, one accent, hairlines. The document is the only thing that gets room. */
:root{
  --bg:#ffffff;--rail:#f7f7f5;--panel:#fafaf8;--ink:#17181a;--ink-2:#55575c;--ink-3:#8a8c92;
  --line:#e7e7e3;--line-2:#d6d6d1;--accent:#1f2a44;--accent-ink:#ffffff;--accent-soft:#eef0f5;
  --quote:#fff3cf;--quote-line:#e0b84a;--bad:#b4231f;--bad-soft:#fbeeed;--ok:#2d7a4f;--warn:#a86a00;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12px}
.sec{color:var(--ink-2)}.ter{color:var(--ink-3)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--rail)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#2a3860}
.btn.quiet{border-color:transparent;color:var(--ink-2)}.btn.quiet:hover{color:var(--ink);background:var(--rail)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.input,.textarea{width:100%;border:1px solid var(--line-2);border-radius:7px;background:#fff;padding:7px 10px;font-size:14px;outline:none;color:var(--ink)}
.input{height:36px}
.textarea{min-height:120px;resize:vertical;line-height:1.55}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
label.field small{font-weight:400;color:var(--ink-3);margin-left:6px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-right:8px;vertical-align:1px}
.status-dot.ok{background:var(--ok)}.status-dot.warn{background:var(--warn)}.status-dot.bad{background:var(--bad)}.status-dot.accent{background:var(--accent)}
/* top bar */
.top{height:52px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);flex:none;gap:16px}
.top .name{font-weight:600;font-size:14.5px}
.top .crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13.5px}
.top .crumbs a{color:var(--ink-2)}.top .crumbs a:hover{color:var(--ink)}
.top .crumbs b{font-weight:500;color:var(--ink)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
/* shell */
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow:auto;padding:36px 40px 80px}
.page .inner{max-width:880px;margin:0 auto}
.page h1{font-size:22px;margin-bottom:4px}
.page .sub{color:var(--ink-2);font-size:14px}
.page .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}
/* table */
table.list{width:100%;border-collapse:collapse;font-size:14px}
.list th{text-align:left;font-weight:500;font-size:12.5px;color:var(--ink-3);padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
.list td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr.row{cursor:pointer}.list tr.row:hover td{background:var(--rail)}
.list td:first-child,.list th:first-child{padding-left:10px}
.list .nm{font-weight:500}.list .ol{color:var(--ink-2);font-size:13px;margin-top:1px}
.list .num{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.list td.nw{white-space:nowrap}
.empty{padding:48px 0;text-align:center;color:var(--ink-3)}
/* form */
.form{display:grid;gap:22px}
.form .three{display:grid;grid-template-columns:1.4fr 2fr 1fr;gap:14px}
.form .src{display:grid;gap:8px}
.form .src .lab{display:flex;align-items:baseline;gap:10px}
.form .src .lab b{font-weight:500;font-size:13.5px}
.form .src .lab span{font-size:12.5px;color:var(--ink-3)}
.form .src .lab label{margin-left:auto;font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:500}
.form .src .lab input[type=file]{display:none}
.form .src textarea{font-family:var(--mono);font-size:12.5px;min-height:132px}
.form .foot{display:flex;align-items:center;gap:14px;padding-top:6px}
.form .err{color:var(--bad);font-size:13px}
/* workspace */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column;min-height:0;overflow:auto}
.rail .co{padding:0 20px 18px}
.rail .co b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.rail .co span{display:block;color:var(--ink-2);font-size:12.5px;margin-top:3px}
.rail .stages{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 20px 9px 18px;border-left:2px solid transparent;color:var(--ink-2);font-size:13.5px;align-items:baseline}
.stage:hover{color:var(--ink)}
.stage.on{border-left-color:var(--accent);color:var(--ink);font-weight:500;background:#fff}
.stage.off{opacity:.45;pointer-events:none}
.stage small{font-size:11.5px;color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.rail .foot{margin-top:auto;padding:18px 20px 0;font-size:12px;color:var(--ink-3);line-height:1.6}
.rail .foot a{color:var(--ink-2)}
.content{min-width:0;min-height:0;display:flex;flex-direction:column}
/* stage pages inside workspace */
.stagehead{display:flex;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--line);flex:none;min-height:56px}
.stagehead h2{font-size:15px;font-weight:600}
.stagehead .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.stagehead .state{font-size:12.5px;color:var(--ink-3)}
.scroll{flex:1;min-height:0;overflow:auto}
.pad{padding:28px 32px 80px}
.narrow{max-width:760px}
/* sources */
.srcblock{margin-bottom:34px}
.srcblock h3{font-size:14px;font-weight:600;margin-bottom:2px}
.srcblock .ti{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.psg{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6}
.psg:last-child{border-bottom:1px solid var(--line)}
.psg .id{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:3px}
.psg .tx{white-space:pre-wrap;color:var(--ink-2)}
.psg mark{background:var(--quote);color:var(--ink);border-radius:2px;padding:0 1px;box-shadow:inset 0 -1px 0 var(--quote-line)}
/* run */
.run{max-width:620px}
.run .step{display:grid;grid-template-columns:22px 110px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.run .step .k{color:var(--ink-2)}.run .step .m{color:var(--ink)}
.run .step i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-2);position:relative;top:-1px}
.run .step.done i{background:var(--ok)}.run .step.on i{background:var(--accent);animation:blink 1.1s ease-in-out infinite}.run .step.err i{background:var(--bad)}
.run .step.skip .m{color:var(--ink-3)}
@keyframes blink{50%{opacity:.25}}
.run ul.f{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.run .result{margin-top:22px;display:flex;align-items:center;gap:18px;font-size:13.5px;color:var(--ink-2)}
.run .result b{color:var(--ink);font-weight:500}
/* document + sources panel */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.docwrap{overflow:auto;min-width:0}
.doc{max-width:700px;margin:0 auto;padding:36px 40px 120px;font-size:15px;line-height:1.65}
.doc .label{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.02em;margin-bottom:10px}
.doc h1{font-size:26px;letter-spacing:-.015em;margin-bottom:6px}
.doc .meta{font-size:13px;color:var(--ink-2)}
.doc .meta + .meta{margin-top:2px}
.doc section{margin-top:40px}
.doc h2{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc .summary{font-size:15.5px;line-height:1.7}
.doc .flags{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:13.5px;color:var(--ink-2)}
.doc .flags ul{margin:0;padding-left:18px}.doc .flags li{margin:4px 0}
.doc .dim{margin-top:26px}
.doc h3{font-size:15px;font-weight:600;margin-bottom:4px}
.doc .finding{color:var(--ink-2);font-size:14px;margin-bottom:8px}
.doc ul.claims{list-style:none;margin:0;padding:0}
.claim{position:relative;display:grid;grid-template-columns:16px 1fr;gap:8px;padding:6px 8px;margin:0 -8px;border-radius:6px;cursor:pointer;font-size:14.5px;line-height:1.55}
.claim:hover{background:var(--rail)}
.claim.lit{background:var(--accent-soft)}
.claim .d{width:6px;height:6px;border-radius:50%;background:var(--ok);margin:9px 0 0 3px}
.claim.warning .d{background:var(--warn)}.claim.failed .d{background:var(--bad)}
.claim.removed .t{color:var(--ink-3);text-decoration:line-through}
.claim .t .ref{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px;white-space:nowrap}
.claim .t .ref.bad{color:var(--bad);text-decoration:line-through}
.claim .t .ed{font-size:11px;color:var(--accent);font-weight:500;margin-left:6px}
.claim .acts{position:absolute;right:8px;top:5px;display:flex;gap:2px;opacity:0;background:inherit}
.claim:hover .acts,.claim.removed .acts{opacity:1}
.claim.lit .acts{background:var(--accent-soft)}
.claim:hover:not(.lit) .acts{background:var(--rail)}
.acts button{font-size:12px;color:var(--ink-2);padding:2px 7px;border-radius:5px}
.acts button:hover{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.editor{grid-column:1/3;margin-top:4px}
.editor .textarea{min-height:68px;font-size:14px}
.editor .r{display:flex;gap:6px;margin-top:6px}
.doc ul.oq{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.doc .gaps{display:grid;gap:10px;font-size:14px}
.doc .gaps b{font-weight:500}.doc .gaps span{color:var(--ink-2)}
.doc .bear{border-left:2px solid var(--bad);padding-left:16px}
.doc .thesis{font-size:15px;margin-bottom:10px}
.doc .note{font-size:15px;white-space:pre-wrap}
.doc .reviewblock{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.doc .reviewblock .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--ink-2)}
.doc .reviewblock input{height:32px;font-size:13.5px;max-width:260px}
.doc .reviewblock textarea{min-height:88px;font-size:14px;background:#fff}
.doc .checks{font-size:13px;color:var(--ink-2);line-height:1.7}
.doc .checks b{font-weight:500;color:var(--ink)}
.doc .checks .fl{margin-top:6px;color:var(--ink-3)}
aside.sources{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside.sources .h{display:flex;align-items:center;gap:10px;padding:0 20px;height:48px;border-bottom:1px solid var(--line);flex:none}
aside.sources .h b{font-weight:600;font-size:13px;flex:1}
aside.sources .h button{font-size:12.5px;color:var(--ink-2)}aside.sources .h button:hover{color:var(--ink)}
aside.sources .body{flex:1;overflow:auto;padding:18px 20px 40px}
aside.sources .none{color:var(--ink-3);font-size:13px;line-height:1.6}
.cl{font-size:14px;line-height:1.5;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.cl .st{font-size:12px;margin-top:6px;color:var(--ink-3)}
.cl .st.verified{color:var(--ok)}.cl .st.warning{color:var(--warn)}.cl .st.failed{color:var(--bad)}
.src{margin-bottom:18px}
.src .sh{display:flex;gap:8px;align-items:baseline;font-size:12px;margin-bottom:6px}
.src .sh .id{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.src .sh .nm{color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .tx{font-size:13.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap}
.src .tx mark{background:var(--quote);color:var(--ink);border-radius:2px;padding:0 1px;box-shadow:inset 0 -1px 0 var(--quote-line)}
.src .warn{font-size:12px;color:var(--bad);margin-top:4px}
.src h5{font-size:12px;font-weight:600;margin:18px 0 8px;color:var(--ink)}
/* follow-up */
.fu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;max-width:1100px}
.fu h3{font-size:14px;font-weight:600;margin-bottom:10px}
.fu ul{list-style:none;margin:0 0 26px;padding:0}
.fu li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.fu li:last-child{border-bottom:1px solid var(--line)}
.fu li input{margin:4px 0 0}
.fu li b{font-weight:500}.fu li span{display:block;color:var(--ink-2);font-size:13px}
.fu li small{display:block;font-size:11.5px;color:var(--ink-3)}
.email{border:1px solid var(--line);border-radius:8px;background:#fff;padding:18px 20px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.email .subj{font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.fu .tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.fu .tools .input{max-width:220px;height:34px}
/* small screens */
@media (max-width:1100px){.split{grid-template-columns:1fr}aside.sources{display:none}.split.show aside.sources{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);z-index:20;box-shadow:-12px 0 32px rgba(0,0,0,.14)}.fu{grid-template-columns:1fr}}
@media (max-width:820px){.ws{grid-template-columns:1fr}.rail{display:none}.form .three{grid-template-columns:1fr}.page{padding:24px 20px}}
@media print{.top,.rail,aside.sources,.stagehead,.acts,.reviewblock{display:none!important}.ws,.split{display:block}.docwrap{overflow:visible}.doc{max-width:none;padding:0}}
</style>

 pay for scheduling and documentation tooling today?"]},{"name":"Product and technology","finding":"The website presents three live modules; the founder confirmed only the scheduling module is in use, with documentation still in development.","claims":[{"text":"The website lists smart scheduling, voice-dictated OASIS-compliant documentation and authorization tracking as product capabilities.","basis":"stated","citations":[{"passage_id":"website:3","quote":"Smart scheduling. Harbor matches visits to clinicians by skill, location and authorization status, and reschedules automatically when a visit falls through.","status":"ok"},{"passage_id":"website:4","quote":"Clinicians speak their visit notes; Harbor drafts OASIS-compliant documentation for review and signature.","status":"ok"},{"passage_id":"website:5","quote":"Harbor tracks authorizations and flags visits at risk of denial before they happen.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The founder said the OASIS documentation feature is in development and that pilots use only the scheduling module.","basis":"stated","citations":[{"passage_id":"call-notes:4","quote":"Tom said it is \"in development\" and that the pilots are using the scheduling module only.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The associate had not seen a product demo at the time of the notes and listed one as a follow-up.","basis":"stated","citations":[{"passage_id":"call-notes:6","quote":"ask for a deck, pilot names, co-founder background and a product demo before spending more time","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The inputs contain no description of the underlying models, data sources or any technical differentiation.","basis":"absence","citations":[{"passage_id":"website:1","quote":"Harbor Health. The AI care coordination layer for home health agencies.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["Is the scheduling module rule-based automation or ML, and what is the measured scheduling improvement at a pilot?","What is the development timeline and clinical validation plan for OASIS documentation?","What EHR or agency systems does Harbor integrate with today?"]},{"name":"Traction and customers","finding":"Traction is described only qualitatively; the founder declined to share customer numbers and no pilot is paying yet.","claims":[{"text":"The founder said Harbor has \"a few pilots\" and declined to share numbers until the round is further along.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"Tom said \"a few pilots\" and that he would rather not share numbers until the round is further along.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"No pilot is paying today; one is said to have committed to pay starting in September.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"Asked whether any pilot is paying; he said one has \"committed to pay\" starting in September.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"No pilot agency is named in any input, and the associate flagged pilot names as an outstanding ask.","basis":"absence","citations":[{"passage_id":"call-notes:6","quote":"Suggested follow-up: ask for a deck, pilot names, co-founder background and a product demo","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The website asserts agencies are already using Harbor without naming any of them.","basis":"stated","citations":[{"passage_id":"website:6","quote":"Trusted by forward-thinking agencies. Join the agencies already using Harbor to deliver more care with the same team.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["How many pilots are live, since when, and what is weekly active usage per pilot?","Is the September commitment a signed contract or a verbal intent, and at what price?","What visit volume or clinician count do the pilot agencies represent?"]},{"name":"Business model and unit economics","finding":"The inputs contain no pricing, revenue, cost or margin data; the only commercial signal is one unquantified future payment.","claims":[{"text":"The only commercial datapoint in the inputs is a pilot's commitment to begin paying in September, with no amount stated.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"he said one has \"committed to pay\" starting in September","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The website's only conversion mechanism is a demo request, with no pricing published.","basis":"stated","citations":[{"passage_id":"website:8","quote":"Request a demo.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The founder was reluctant on every quantitative question in the call, per the associate.","basis":"stated","citations":[{"passage_id":"call-notes:6","quote":"He was reluctant on every quantitative question.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What is the pricing model: per agency, per clinician, per visit, or percentage of billings?","What is current burn and runway, and what revenue exists to date?","What does implementation cost per agency in time and services?"]},{"name":"Competition and defensibility","finding":"Neither source names a competitor or describes any moat; the only defensibility signal is the founder's operating background.","claims":[{"text":"No competitor, incumbent EHR vendor or alternative tool is named anywhere in the website or call notes.","basis":"absence","citations":[{"passage_id":"website:1","quote":"Harbor Health. The AI care coordination layer for home health agencies.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The deployed product is a single scheduling module, which limits any claim of workflow lock-in today.","basis":"derived","citations":[{"passage_id":"call-notes:4","quote":"the pilots are using the scheduling module only","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The associate noted the founder clearly knows home health operations, which is the only stated differentiator in the inputs.","basis":"stated","citations":[{"passage_id":"call-notes:6","quote":"Tom was personable and clearly knows home health operations.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["Which vendors do pilot agencies currently use for scheduling and documentation, and what did Harbor displace?","What proprietary data, if any, accrues from usage?","What would stop an incumbent home health EHR from shipping the same scheduling automation?"]},{"name":"Round and use of funds","finding":"A $3M seed is being raised with no lead committed and no stated use of proceeds.","claims":[{"text":"Harbor is raising $3M with no lead investor, and the founder said two other funds are \"interested.\"","basis":"stated","citations":[{"passage_id":"call-notes:5","quote":"Raising $3M. No lead. Tom said two other funds are \"interested.\"","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The inputs contain no valuation, instrument, prior financing history or planned use of funds.","basis":"absence","citations":[{"passage_id":"call-notes:5","quote":"Raising $3M. No lead.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"No deck existed in the inputs at the time of the call; the associate listed obtaining one as a follow-up.","basis":"stated","citations":[{"passage_id":"call-notes:6","quote":"Suggested follow-up: ask for a deck, pilot names, co-founder background and a product demo before spending more time.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What valuation and instrument are proposed, and has any capital been raised previously?","Which two funds are interested and at what stage of diligence?","What milestones is the $3M intended to reach?"]},{"name":"Operational and regulatory risk","finding":"The product touches HIPAA-regulated clinical data and OASIS submissions; the inputs assert compliance without documentation.","claims":[{"text":"The website states Harbor is HIPAA compliant, with no supporting audit or certification referenced in the inputs.","basis":"stated","citations":[{"passage_id":"website:7","quote":"HIPAA compliant. Built for the realities of home health.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The documentation feature is intended to draft OASIS-compliant records for clinician review and signature, placing it in a regulated reimbursement workflow.","basis":"stated","citations":[{"passage_id":"website:4","quote":"Harbor drafts OASIS-compliant documentation for review and signature.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The authorization-denial feature implies payer-facing risk, but the inputs contain no evidence of payer relationships or denial-rate results.","basis":"absence","citations":[{"passage_id":"website:5","quote":"Payer-ready. Harbor tracks authorizations and flags visits at risk of denial before they happen.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["Are BAAs signed with pilot agencies and is there a SOC 2 or equivalent security review?","Who bears liability if AI-drafted OASIS documentation leads to a denied or clawed-back claim?","How is PHI handled by any third-party model providers?"]}],"contradictions":[{"text":"The website presents OASIS documentation as a working feature while the founder said it is in development and pilots use scheduling only.","basis":"stated","citations":[{"passage_id":"website:4","quote":"Documentation that writes itself. Clinicians speak their visit notes; Harbor drafts OASIS-compliant documentation for review and signature.","status":"ok"},{"passage_id":"call-notes:4","quote":"Tom said it is \"in development\" and that the pilots are using the scheduling module only.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The website claims agencies already use Harbor, while the founder described only \"a few pilots\" with none currently paying.","basis":"stated","citations":[{"passage_id":"website:6","quote":"Join the agencies already using Harbor to deliver more care with the same team.","status":"ok"},{"passage_id":"call-notes:2","quote":"Tom said \"a few pilots\" and that he would rather not share numbers until the round is further along.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The founder called Harbor \"an operating system for home health\" while the deployed scope is one scheduling module.","basis":"stated","citations":[{"passage_id":"call-notes:1","quote":"He described Harbor as \"an operating system for home health\"","status":"ok"},{"passage_id":"call-notes:4","quote":"the pilots are using the scheduling module only","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"missing":[{"item":"A pitch deck or any written company materials","why_it_matters":"The entire assessment rests on one short call and a marketing homepage; there is no primary document stating metrics, plan or team."},{"item":"Named pilot agencies with start dates, usage data and reference contacts","why_it_matters":"\"A few pilots\" cannot be verified or sized; usage depth determines whether scheduling automation actually works in production."},{"item":"Co-founder identity, CV and employment status","why_it_matters":"The technical half of the team is unverified and the equity split is open, which is a core founding-risk question at seed."},{"item":"Pricing, revenue, burn, runway and any financial model","why_it_matters":"Without pricing or cost data, neither the September payment commitment nor the $3M ask can be evaluated against milestones."},{"item":"Competitive landscape and win/loss detail","why_it_matters":"The inputs name no competitor; home health scheduling and documentation are served by incumbent EHR and workforce vendors whose presence would shape wedge and pricing."},{"item":"Security and compliance documentation (BAAs, SOC 2, HIPAA assessment)","why_it_matters":"HIPAA compliance is asserted on the homepage only; agencies and payers will diligence this before purchase."},{"item":"Term sheet details: valuation, instrument, existing investors and the identity of the two interested funds","why_it_matters":"Round structure and who else is at the table determine both price and the realistic path to a close."},{"item":"Founder references, including from the 2023 agency sale","why_it_matters":"The operator background is the strongest stated asset and is currently uncorroborated."}],"bear_case":{"thesis":"On these inputs, Harbor is a single verified founder with a domain story, one scheduling module in unpaid pilots, and a website that describes a product that does not yet exist. Every quantitative question in the only call was deflected, so there is no evidence base to underwrite beyond the founder's biography. A $3M seed with no lead and no deck is being asked for against marketing claims the founder himself narrowed within minutes of being asked.","points":[{"text":"The headline documentation feature, which is the hardest and most differentiated part of the offering, is not built.","basis":"stated","citations":[{"passage_id":"call-notes:4","quote":"Tom said it is \"in development\" and that the pilots are using the scheduling module only.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"There is no revenue; the strongest commercial fact is a verbal commitment to begin paying in a future month.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"Asked whether any pilot is paying; he said one has \"committed to pay\" starting in September.","status":"ok"}],"verification":{"statu is intended to draft OASIS-compliant records for clinician review and signature, placing it in a regulated reimbursement workflow.","basis":"stated","deterministic":"verified","verdict":"partial","reason":"The passage supports the documentation description but not the added characterization of a 'regulated reimbursement workflow.'"},{"id":"d7.c2","where":"Operational and regulatory risk","text":"The authorization-denial feature implies payer-facing risk, but the inputs contain no evidence of payer relationships or denial-rate results.","basis":"absence","deterministic":"verified","verdict":"supported","reason":"The payer-ready feature description lacks any payer relationship or denial-rate data."},{"id":"x0","where":"Contradictions","text":"The website presents OASIS documentation as a working feature while the founder said it is in development and pilots use scheduling only.","basis":"stated","deterministic":"verified","verdict":"supported","reason":"The two passages directly contradict each other as described."},{"id":"x1","where":"Contradictions","text":"The website claims agencies already use Harbor, while the founder described only \"a few pilots\" with none currently paying.","basis":"stated","deterministic":"verified","verdict":"supported","reason":"Website and call notes show a clear discrepancy in customer claims."},{"id":"x2","where":"Contradictions","text":"The founder called Harbor \"an operating system for home health\" while the deployed scope is one scheduling module.","basis":"stated","deterministic":"verified","verdict":"supported","reason":"The broad 'operating system' description contrasts with the narrow scheduling-only deployment."},{"id":"b0","where":"Bear case","text":"The headline documentation feature, which is the hardest and most differentiated part of the offering, is not built.","basis":"stated","deterministic":"verified","verdict":"partial","reason":"Passage confirms the feature is in development but not that it is the hardest or most differentiated part."},{"id":"b1","where":"Bear case","text":"There is no revenue; the strongest commercial fact is a verbal commitment to begin paying in a future month.","basis":"stated","deterministic":"verified","verdict":"supported","reason":"Consistent with call notes showing no paying pilots and a future payment commitment."},{"id":"b2","where":"Bear case","text":"The founder declined to provide customer numbers, so the pilot base cannot be verified or sized.","basis":"stated","deterministic":"verified","verdict":"supported","reason":"Matches founder's refusal to share pilot numbers."},{"id":"b3","where":"Bear case","text":"The technical co-founder is unnamed and not yet committed to a fixed equity stake, so the founding team may not be stable.","basis":"stated","deterministic":"verified","verdict":"supported","reason":"Reasonable inference from unnamed co-founder and unfinalized equity split."},{"id":"b4","where":"Bear case","text":"The website claims agencies are already using the product while the founder's own account describes unpaid pilots, a gap a buyer or later investor may also notice.","basis":"derived","deterministic":"verified","verdict":"supported","reason":"Both cited passages substantiate the stated gap between website claims and actual pilot status."},{"id":"b5","where":"Bear case","text":"No competitor, pricing, financial or market-size data exists anywhere in the inputs, so no part of the opportunity can be independently tested at this stage.","basis":"absence","deterministic":"verified","verdict":"partial","reason":"The single cited passage only reflects founder reluctance, not a full absence of competitor, pricing, financial, and market data across all inputs."}],"usage":{"input_tokens":5677,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":4287,"service_tier":"standard","inference_geo":"global","output_tokens_details":{"thinking_tokens":2462}}}}},{"slug":"lumen-grid","name":"Lumen Grid","one_liner":"Interconnection-queue workflow software for electric utilities","ask":"$2.5M seed","record":{"slug":"lumen-grid","company":{"slug":"lumen-grid","name":"Lumen Grid","one_liner":"Interconnection-queue workflow software for electric utilities","ask":"$2.5M seed","design_note":"Baseline case. Sources are consistent and reasonably complete. The tool should produce a well-cited assessment and still find real gaps (churn exposure, concentration, sales cycle)."},"generated_at":"2026-10-03 18:50 UTC","model":"claude-opus-5","repairs":0,"first_pass_verification":{"statements":46,"verified":46,"warning":0,"failed":0,"citations":63,"citations_ok":63},"verification_summary":{"statements":46,"verified":46,"warning":0,"failed":0,"citations":63,"citations_ok":63},"sources":[{"key":"deck","title":"Lumen Grid — Seed Deck (June 2026)","passages":8},{"key":"website","title":"lumengrid.io — homepage and product pages (captured 14 June 2026)","passages":6},{"key":"founders","title":"Founder bios (provided by the company)","passages":3},{"key":"call-notes","title":"First call notes — Lumen Grid, 18 June 2026 (associate: M. Chen, 45 minutes with Priya and Daniel)","passages":9}],"passages":{"deck:1":{"source":"deck","text":"Slide 1: Interconnection is the bottleneck of the energy transition\nOver 2,600 GW of generation and storage projects are waiting in US interconnection queues. The median project now waits almost five years for a utility study. Utilities run these studies with spreadsheets, email and a handful of overworked engineers."},"deck:2":{"source":"deck","text":"Slide 2: What we built\nLumen Grid is workflow software for utility interconnection teams. It ingests applications, tracks study milestones, runs completeness checks against each utility's tariff, and produces the regulator-facing queue reports automatically. Engineers spend their time on power-flow analysis instead of chasing paperwork."},"deck:3":{"source":"deck","text":"Slide 3: Traction\nSix utilities are paying customers today, representing $38,000 in monthly recurring revenue. Two additional investor-owned utilities are in paid pilots that convert to annual contracts in Q4 2026 if they hit agreed milestones. Net revenue retention across the six paying accounts is 118% on a trailing-twelve-month basis."},"deck:4":{"source":"deck","text":"Slide 4: Customers\nPaying: Cascade Public Utility District, Three Rivers Electric Cooperative, Northfield Municipal Light, Blue Mesa Cooperative, Pinecrest Utilities, Harlan County Electric. Piloting: Great Lakes Energy (IOU, 1.1M meters) and Southern Tier Power (IOU, 640k meters)."},"deck:5":{"source":"deck","text":"Slide 5: Business model\nAnnual SaaS subscription priced by meter count and queue volume. Current contracts range from $42,000 to $110,000 per year. Gross margin is 81%. Average sales cycle for cooperatives and munis has been 4 months; the two IOU pilots took 9 months to sign."},"deck:6":{"source":"deck","text":"Slide 6: Market\nThere are roughly 3,000 electric utilities in the United States. We count 410 that process more than 50 interconnection applications per year, which is our serviceable market. At our current average contract value this is a $29M annual opportunity in the US before expanding into transmission-level studies and Canada."},"deck:7":{"source":"deck","text":"Slide 7: Team\nPriya Raman (CEO) spent eight years at Pacific Gas & Electric, the last three running the distribution interconnection group. Daniel Okafor (CTO) was a forward-deployed engineer at Palantir for five years and built utility data integrations at Camus Energy. Team of seven: four engineers, one implementation lead, one account executive."},"deck:8":{"source":"deck","text":"Slide 8: The raise\nRaising $2.5M on a post-money SAFE. Use of funds: three engineers, two implementation specialists, one utility sales lead. Target is 20 paying utilities and $1.5M ARR by December 2027."},"website:1":{"source":"website","text":"Lumen Grid: Interconnection, in order. Software that helps utility interconnection teams clear their queue faster, with less paperwork and fewer errors."},"website:2":{"source":"website","text":"How it works. Applicants submit through a branded portal. Lumen Grid validates every application against your tariff rules before an engineer ever sees it, assigns study milestones, tracks deadlines under FERC Order 2023 and state timelines, and generates the quarterly queue report your commission expects."},"website:3":{"source":"website","text":"Built by people who ran interconnection. Our founding team ran a distribution interconnection group at a major California utility and has processed more than 12,000 applications first-hand."},"website:4":{"source":"website","text":"Customers. Cascade PUD cut its average application review time from 31 days to 9 days in the first quarter on Lumen Grid. Three Rivers Electric Cooperative eliminated its backlog of 240 pending applications within five months."},"website:5":{"source":"website","text":"Security. SOC 2 Type I report completed in March 2026. Type II audit in progress. Hosted in US regions only."},"website:6":{"source":"website","text":"Pricing. Annual plans sized to your utility. Contact sales for a quote."},"founders:1":{"source":"founders","text":"Priya Raman, co-founder and CEO. Eight years at Pacific Gas & Electric, 2016 to 2024. Senior engineer in distribution planning, then manager of the distribution interconnection group from 2021, overseeing a team of 14 engineers and analysts. BS and MS in electrical engineering, UC Davis. Left PG&E in September 2024 to start Lumen Grid."},"founders:2":{"source":"founders","text":"Daniel Okafor, co-founder and CTO. Forward-deployed engineer at Palantir from 2017 to 2022, where he led utility and energy deployments. Staff engineer at Camus Energy from 2022 to 2024, building grid data integrations for cooperative utilities. BS in computer science, Georgia Tech."},"founders:3":{"source":"founders","text":"Priya and Daniel met in 2023 when Camus Energy integrated with PG&E's interconnection systems. They have worked together full-time since October 2024."},"call-notes:1":{"source":"call-notes","text":"Priya walked through the queue problem with specifics from her PG&E time. Credible, unusually detailed on tariff mechanics. Daniel did the product demo; the tariff rule engine is the differentiated piece and took them nine months to build."},"call-notes:2":{"source":"call-notes","text":"Revenue. Confirmed $38k MRR. Of the six paying utilities, four are on annual contracts and two (Pinecrest and Harlan County) are month-to-month while they finish procurement approval. Cascade PUD is the largest at $110k per year and is 24% of MRR."},"call-notes:3":{"source":"call-notes","text":"Pilots. Great Lakes Energy pilot started in April, Southern Tier in May. Both are paid at $15k for six months. Conversion criteria are written into the pilot agreements. Priya said she would put the odds of both converting at \"better than even\" but would not commit to more than that."},"call-notes:4":{"source":"call-notes","text":"Churn. No logo churn to date. One customer (Blue Mesa) went quiet for two months during a staff change and has since re-engaged."},"call-notes:5":{"source":"call-notes","text":"Competition. Asked about PowerClerk (Clean Power Research) which is widely used. Priya's view: PowerClerk handles application intake well but does not model study workflow or tariff completeness rules; several Lumen customers still use PowerClerk for intake and Lumen for everything after. She acknowledged PowerClerk could extend into their space. GridUnity is the other named competitor; focused on transmission-level work and larger IOUs."},"call-notes:6":{"source":"call-notes","text":"Sales. The cooperative and muni motion is referral-driven through state cooperative associations. IOU sales require a procurement process and a security review; the SOC 2 Type I was done specifically to unblock Great Lakes."},"call-notes:7":{"source":"call-notes","text":"Hiring. Seven people. Two engineers are contractors in Portugal they intend to convert to full-time after the raise."},"call-notes:8":{"source":"call-notes","text":"Round. $2.5M on a $14M post-money SAFE. They have $600k soft-circled from an energy angel syndicate. Runway at current burn is 11 months without the raise."},"call-notes:9":{"source":"call-notes","text":"Follow-ups: reference calls with Cascade PUD and Three Rivers; copy of the pilot agreements; cohort data behind the 118% NRR figure."}},"assessment":{"company_name":"Lumen Grid","summary":"Lumen Grid sells workflow software to electric utility interconnection teams: it ingests applications, validates them against each utility's tariff, tracks study milestones and generates regulator-facing queue reports. The deck reports six paying utilities and $38,000 MRR, 118% trailing NRR, 81% gross margin and contracts of $42k-$110k per year. The first call confirms the $38k but narrows the picture: only four of six are on annual contracts, Pinecrest and Harlan County are month-to-month pending procurement, and Cascade PUD alone is 24% of MRR. The deck says the two IOU pilots convert in Q4 2026 if milestones are hit; on the call Priya put the odds at \"better than even\" and would not go further. The website says the founding team ran an interconnection group and processed 12,000+ applications; the bios attribute that experience to Priya alone. Two of the seven staff are Portugal contractors. Partners would need the cohort data behind the 118% NRR, the pilot agreements with their conversion criteria, and a view on whether PowerClerk extends into the study-workflow layer.","dimensions":[{"name":"Team","finding":"Priya Raman brings eight years at PG&E including running its distribution interconnection group; Daniel Okafor brings Palantir forward-deployed and Camus Energy grid-integration experience. They have worked together full-time only since October 2024.","claims":[{"text":"Priya Raman spent eight years at PG&E and managed the distribution interconnection group from 2021, overseeing 14 engineers and analysts.","basis":"stated","citations":[{"passage_id":"founders:1","quote":"manager of the distribution interconnection group from 2021, overseeing a team of 14 engineers and analysts","status":"ok"},{"passage_id":"deck:7","quote":"Priya Raman (CEO) spent eight years at Pacific Gas & Electric, the last three running the distribution interconnection group.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Daniel Okafor was a forward-deployed engineer at Palantir from 2017 to 2022 and a staff engineer at Camus Energy from 2022 to 2024 building grid data integrations for cooperative utilities.","basis":"stated","citations":[{"passage_id":"founders:2","quote":"Forward-deployed engineer at Palantir from 2017 to 2022, where he led utility and energy deployments. Staff engineer at Camus Energy from 2022 to 2024","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The founders met in 2023 and have worked together full-time since October 2024.","basis":"stated","citations":[{"passage_id":"founders:3","quote":"Priya and Daniel met in 2023 when Camus Energy integrated with PG&E's interconnection systems. They have worked together full-time since October 2024.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Of the seven people on the team, two engineers are contractors based in Portugal whom the company intends to convert to full-time after the raise.","basis":"stated","citations":[{"passage_id":"call-notes:7","quote":"Two engineers are contractors in Portugal they intend to convert to full-time after the raise.","status":"ok"},{"passage_id":"deck:7","quote":"Team of seven: four engineers, one implementation lead, one account executive.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["The deck's team breakdown lists four engineers, one implementation lead and one account executive alongside two founders; how does that reconcile with 'team of seven'?","Will the two Portugal contractors convert, and what employment or IP-assignment arrangements are in place today?","Are there founder references from PG&E and Camus Energy available?"]},{"name":"Problem and market","finding":"The deck sizes the problem with national queue statistics and defines a serviceable market of 410 US utilities worth $29M annually at current average contract value, with the ACV used in that calculation not disclosed.","claims":[{"text":"The deck states over 2,600 GW of generation and storage projects sit in US interconnection queues with a median wait of almost five years for a utility study.","basis":"stated","citations":[{"passage_id":"deck:1","quote":"Over 2,600 GW of generation and storage projects are waiting in US interconnection queues. The median project now waits almost five years for a utility study.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The company counts 410 of roughly 3,000 US electric utilities as its serviceable market, those processing more than 50 interconnection applications per year.","basis":"stated","citations":[{"passage_id":"deck:6","quote":"There are roughly 3,000 electric utilities in the United States. We count 410 that process more than 50 interconnection applications per year, which is our serviceable market.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The stated $29M US annual opportunity rests on an unstated 'current average contract value' while disclosed contracts span $42,000 to $110,000 per year.","basis":"derived","citations":[{"passage_id":"deck:6","quote":"At our current average contract value this is a $29M annual opportunity in the US before expanding into transmission-level studies and Canada.","status":"ok"},{"passage_id":"deck:5","quote":"Current contracts range from $42,000 to $110,000 per year.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"No source gives the methodology or data source behind the 410-utility count.","basis":"absence","citations":[{"passage_id":"deck:6","quote":"We count 410 that process more than 50 interconnection applications per year, which is our serviceable market.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What average contract value underlies the $29M serviceable market figure?","How was the 410-utility count constructed, and how many of those 410 are IOUs versus co-ops and munis?","What is the size and timing of the transmission-level and Canada expansion the deck references?"]},{"name":"Product and technology","finding":"The product covers application intake, tariff-based completeness checks, milestone tracking and regulator-facing reporting; the associate identified the tariff rule engine as the differentiated component.","claims":[{"text":"The product ingests applications, tracks study milestones, runs completeness checks against each utility's tariff and generates regulator-facing queue reports.","basis":"stated","citations":[{"passage_id":"deck:2","quote":"It ingests applications, tracks study milestones, runs completeness checks against each utility's tariff, and produces the regulator-facing queue reports automatically.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The tariff rule engine took nine months to build and was identified on the call as the differentiated piece.","basis":"stated","citations":[{"passage_id":"call-notes:1","quote":"the tariff rule engine is the differentiated piece and took them nine months to build.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The website states the product tracks deadlines under FERC Order 2023 and state timelines and produces the quarterly commission queue report.","basis":"stated","citations":[{"passage_id":"website:2","quote":"tracks deadlines under FERC Order 2023 and state timelines, and generates the quarterly queue report your commission expects.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The sources do not describe how tariff rules are configured per utility or how much implementation effort each new utility requires.","basis":"absence","citations":[{"passage_id":"deck:2","quote":"runs completeness checks against each utility's tariff","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["How long does onboarding a new utility's tariff ruleset take, and is it engineering-led or self-serve configuration?","Does the product handle transmission-level study workflow today or only distribution?","How are FERC Order 2023 and state rule changes maintained in the product over time?"]},{"name":"Traction and customers","finding":"Six paying utilities generate $38,000 MRR, confirmed on the call, but two of the six are month-to-month and one account is 24% of MRR; two IOU pilots are paid at $15k for six months.","claims":[{"text":"Six utilities pay today, representing $38,000 in monthly recurring revenue, confirmed on the first call.","basis":"stated","citations":[{"passage_id":"deck:3","quote":"Six utilities are paying customers today, representing $38,000 in monthly recurring revenue.","status":"ok"},{"passage_id":"call-notes:2","quote":"Confirmed $38k MRR.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Four of the six paying customers are on annual contracts; Pinecrest and Harlan County are month-to-month pending procurement approval.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"four are on annual contracts and two (Pinecrest and Harlan County) are month-to-month while they finish procurement approval","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Cascade PUD is the largest customer at $110k per year and accounts for 24% of MRR.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"Cascade PUD is the largest at $110k per year and is 24% of MRR.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The two IOU pilots, Great Lakes Energy and Southern Tier Power, began in April and May and are paid at $15k for six months each.","basis":"stated","citations":[{"passage_id":"call-notes:3","quote":"Great Lakes Energy pilot started in April, Southern Tier in May. Both are paid at $15k for six months.","status":"ok"},{"passage_id":"deck:4","quote":"Piloting: Great Lakes Energy (IOU, 1.1M meters) and Southern Tier Power (IOU, 640k meters).","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"There has been no logo churn to date, though Blue Mesa went quiet for two months during a staff change before re-engaging.","basis":"stated","citations":[{"passage_id":"call-notes:4","quote":"No logo churn to date. One customer (Blue Mesa) went quiet for two months during a staff change and has since re-engaged.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What cohort data supports the 118% NRR across six accounts, and which accounts expanded?","What are the written conversion criteria in the Great Lakes and Southern Tier pilot agreements?","Will Pinecrest and Harlan County complete procurement and move to annual contracts, and by when?"]},{"name":"Business model and unit economics","finding":"Annual SaaS priced by meter count and queue volume, contracts $42k-$110k, reported 81% gross margin, with sales cycles of 4 months for co-ops and munis versus 9 months for the IOU pilots.","claims":[{"text":"Pricing is an annual SaaS subscription by meter count and queue volume, with current contracts between $42,000 and $110,000 per year.","basis":"stated","citations":[{"passage_id":"deck:5","quote":"Annual SaaS subscription priced by meter count and queue volume. Current contracts range from $42,000 to $110,000 per year.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The deck reports 81% gross margin.","basis":"stated","citations":[{"passage_id":"deck:5","quote":"Gross margin is 81%.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Average sales cycle has been 4 months for cooperatives and munis and 9 months for the two IOU pilots.","basis":"stated","citations":[{"passage_id":"deck:5","quote":"Average sales cycle for cooperatives and munis has been 4 months; the two IOU pilots took 9 months to sign.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"No source provides CAC, payback period, burn rate, or the cost base behind the 81% gross margin.","basis":"absence","citations":[{"passage_id":"deck:5","quote":"Gross margin is 81%.","status":"ok"},{"passage_id":"call-notes:8","quote":"Runway at current burn is 11 months without the raise.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What is monthly burn in dollars, and what does the 11-month runway assume?","Is implementation labour included in cost of revenue for the 81% margin?","What does CAC look like for referral-driven co-op deals versus IOU procurement deals?"]},{"name":"Competition and defensibility","finding":"PowerClerk is the widely used incumbent for intake and GridUnity serves transmission and larger IOUs; the founder positions Lumen above intake but acknowledges PowerClerk could extend into the study-workflow layer.","claims":[{"text":"The founder's position is that PowerClerk handles application intake but does not model study workflow or tariff completeness rules, with several Lumen customers using both.","basis":"stated","citations":[{"passage_id":"call-notes:5","quote":"PowerClerk handles application intake well but does not model study workflow or tariff completeness rules; several Lumen customers still use PowerClerk for intake and Lumen for everything after.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The founder acknowledged PowerClerk could extend into Lumen Grid's space.","basis":"stated","citations":[{"passage_id":"call-notes:5","quote":"She acknowledged PowerClerk could extend into their space.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"GridUnity is the other named competitor and is described as focused on transmission-level work and larger IOUs.","basis":"stated","citations":[{"passage_id":"call-notes:5","quote":"GridUnity is the other named competitor; focused on transmission-level work and larger IOUs.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The claimed defensibility rests on the tariff rule engine, which the sources describe only as nine months of build effort with no detail on data moat or switching costs.","basis":"derived","citations":[{"passage_id":"call-notes:1","quote":"the tariff rule engine is the differentiated piece and took them nine months to build.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["Has Lumen Grid competed head-to-head against PowerClerk or GridUnity in any deal, and what was the outcome?","How many utilities use PowerClerk for intake alongside Lumen, and does that create a displacement risk if PowerClerk expands?","What switching costs exist once a utility's tariff rules are encoded?"]},{"name":"Round and use of funds","finding":"The raise is $2.5M on a $14M post-money SAFE with $600k soft-circled; funds go to six hires against a target of 20 paying utilities and $1.5M ARR by December 2027.","claims":[{"text":"The round is $2.5M on a $14M post-money SAFE, with $600k soft-circled from an energy angel syndicate.","basis":"stated","citations":[{"passage_id":"call-notes:8","quote":"$2.5M on a $14M post-money SAFE. They have $600k soft-circled from an energy angel syndicate.","status":"ok"},{"passage_id":"deck:8","quote":"Raising $2.5M on a post-money SAFE.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Use of funds is three engineers, two implementation specialists and one utility sales lead.","basis":"stated","citations":[{"passage_id":"deck:8","quote":"Use of funds: three engineers, two implementation specialists, one utility sales lead.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The plan targets 20 paying utilities and $1.5M ARR by December 2027, from six paying utilities and $38,000 MRR today.","basis":"stated","citations":[{"passage_id":"deck:8","quote":"Target is 20 paying utilities and $1.5M ARR by December 2027.","status":"ok"},{"passage_id":"deck:3","quote":"Six utilities are paying customers today, representing $38,000 in monthly recurring revenue.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Runway at current burn is 11 months without the raise.","basis":"stated","citations":[{"passage_id":"call-notes:8","quote":"Runway at current burn is 11 months without the raise.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"No cap table, prior SAFE terms, or existing investor list appears in any source.","basis":"absence","citations":[{"passage_id":"call-notes:8","quote":"$2.5M on a $14M post-money SAFE.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What prior financing exists and on what terms, and what is the fully diluted ownership after this round?","Is the $600k soft-circled amount documented, and on the same terms?","How does the hiring plan of six map to the path from 6 to 20 paying utilities with one utility sales lead?"]},{"name":"Operational and regulatory risk","finding":"The product sits against FERC Order 2023 and state interconnection timelines; SOC 2 Type I was completed in March 2026 specifically to unblock an IOU, with Type II still in progress.","claims":[{"text":"SOC 2 Type I was completed in March 2026 and the Type II audit is in progress.","basis":"stated","citations":[{"passage_id":"website:5","quote":"SOC 2 Type I report completed in March 2026. Type II audit in progress.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The SOC 2 Type I was undertaken specifically to unblock the Great Lakes IOU deal, and IOU sales require procurement and a security review.","basis":"stated","citations":[{"passage_id":"call-notes:6","quote":"IOU sales require a procurement process and a security review; the SOC 2 Type I was done specifically to unblock Great Lakes.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The co-op and muni sales motion is referral-driven through state cooperative associations.","basis":"stated","citations":[{"passage_id":"call-notes:6","quote":"The cooperative and muni motion is referral-driven through state cooperative associations.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The product's outputs are regulator-facing, including the quarterly queue report filed with commissions.","basis":"stated","citations":[{"passage_id":"website:2","quote":"generates the quarterly queue report your commission expects","status":"ok"},{"passage_id":"deck:2","quote":"produces the regulator-facing queue reports automatically","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"open_questions":["What liability does Lumen Grid carry if an automatically generated regulator-facing report is wrong?","When is SOC 2 Type II expected to complete, and is it a gating item for Southern Tier or other IOUs?","Do the Portugal-based contractors create data residency issues given the 'US regions only' hosting claim?"]}],"contradictions":[{"text":"The deck presents six paying customers without qualification, while the call shows two of the six are month-to-month pending procurement approval.","basis":"stated","citations":[{"passage_id":"deck:3","quote":"Six utilities are paying customers today, representing $38,000 in monthly recurring revenue.","status":"ok"},{"passage_id":"call-notes:2","quote":"four are on annual contracts and two (Pinecrest and Harlan County) are month-to-month while they finish procurement approval","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The deck states the two IOU pilots convert to annual contracts in Q4 2026 if milestones are hit, while on the call Priya would commit only to odds of \"better than even.\"","basis":"stated","citations":[{"passage_id":"deck:3","quote":"Two additional investor-owned utilities are in paid pilots that convert to annual contracts in Q4 2026 if they hit agreed milestones.","status":"ok"},{"passage_id":"call-notes:3","quote":"Priya said she would put the odds of both converting at \"better than even\" but would not commit to more than that.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The website attributes running an interconnection group and 12,000+ processed applications to the founding team, while the bios attribute that role to Priya alone and place Daniel at Palantir and Camus Energy.","basis":"stated","citations":[{"passage_id":"website:3","quote":"Our founding team ran a distribution interconnection group at a major California utility and has processed more than 12,000 applications first-hand.","status":"ok"},{"passage_id":"founders:2","quote":"Forward-deployed engineer at Palantir from 2017 to 2022, where he led utility and energy deployments.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The deck describes a team of seven without noting that two of the engineers are contractors in Portugal.","basis":"stated","citations":[{"passage_id":"deck:7","quote":"Team of seven: four engineers, one implementation lead, one account executive.","status":"ok"},{"passage_id":"call-notes:7","quote":"Two engineers are contractors in Portugal they intend to convert to full-time after the raise.","status":"ok"}],"verification":{"status":"verified","issues":[]}}],"missing":[{"item":"Cohort data behind the 118% net revenue retention figure","why_it_matters":"NRR computed across six accounts can be driven by a single expansion; the associate already listed this as a follow-up and it underpins the growth story."},{"item":"Copies of the Great Lakes Energy and Southern Tier Power pilot agreements with conversion criteria","why_it_matters":"The deck's Q4 2026 conversion claim and the step up from $15k pilots to annual contracts depend entirely on these terms."},{"item":"Customer reference calls (Cascade PUD and Three Rivers were flagged as follow-ups)","why_it_matters":"Cascade is 24% of MRR and the website's time-to-review and backlog results are self-published and unverified."},{"item":"Monthly burn, P&L and the cost base behind the 81% gross margin","why_it_matters":"Only an 11-month runway figure is given; margin quality depends on whether implementation labour is in cost of revenue."},{"item":"Cap table, prior financings and existing SAFE terms","why_it_matters":"Only the $14M post-money of this round is disclosed, so dilution and existing investor rights are unknown."},{"item":"Pipeline detail for the path from 6 to 20 paying utilities","why_it_matters":"The December 2027 target implies a materially faster acquisition rate with one new sales lead, and no pipeline is shown."},{"item":"Independent competitive landscape beyond PowerClerk and GridUnity","why_it_matters":"Both competitors are described only through the founder's own framing on the call."},{"item":"Contracts and IP assignment for the Portugal-based contractors","why_it_matters":"Two of seven team members sit outside the company's employment structure while the site advertises US-only hosting."},{"item":"Signed contract terms for the four annual customers (term length, auto-renewal, termination)","why_it_matters":"Determines how durable the $38k MRR is beyond the next renewal cycle."}],"bear_case":{"thesis":"Stripped of the deck's framing, this is roughly $38k of MRR across six small co-op and municipal accounts, two of which can cancel monthly and one of which is a quarter of revenue, sold into a self-defined serviceable market the company itself values at $29M. The differentiated asset is a nine-month-old tariff rule engine sitting downstream of an incumbent, PowerClerk, that already owns intake and that the founder concedes could move into the workflow layer. The IOU motion that would make the numbers work took nine months to sign two paid pilots, requires procurement and security review, and the founder would not commit beyond \"better than even\" on conversion.","points":[{"text":"Revenue concentration is high: Cascade PUD alone is 24% of MRR at $110k per year.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"Cascade PUD is the largest at $110k per year and is 24% of MRR.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"Two of the six paying customers are month-to-month rather than contracted, so a third of the logo count can lapse without notice.","basis":"stated","citations":[{"passage_id":"call-notes:2","quote":"four are on annual contracts and two (Pinecrest and Harlan County) are month-to-month while they finish procurement approval","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The company's own serviceable market is 410 utilities and a $29M annual US opportunity, which caps domestic outcomes absent the unproven transmission and Canada expansion.","basis":"stated","citations":[{"passage_id":"deck:6","quote":"We count 410 that process more than 50 interconnection applications per year","status":"ok"},{"passage_id":"deck:6","quote":"this is a $29M annual opportunity in the US before expanding into transmission-level studies and Canada","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The founder concedes the widely used incumbent PowerClerk could extend into Lumen Grid's space, and several Lumen customers already run PowerClerk for intake.","basis":"stated","citations":[{"passage_id":"call-notes:5","quote":"several Lumen customers still use PowerClerk for intake and Lumen for everything after. She acknowledged PowerClerk could extend into their space.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The IOU path is slow and gated: 9-month sales cycles, procurement plus security review, and SOC 2 Type II still in progress.","basis":"stated","citations":[{"passage_id":"deck:5","quote":"the two IOU pilots took 9 months to sign","status":"ok"},{"passage_id":"call-notes:6","quote":"IOU sales require a procurement process and a security review","status":"ok"},{"passage_id":"website:5","quote":"Type II audit in progress.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The 118% NRR is drawn from only six paying accounts and no cohort data supporting it has been provided.","basis":"absence","citations":[{"passage_id":"deck:3","quote":"Net revenue retention across the six paying accounts is 118% on a trailing-twelve-month basis.","status":"ok"},{"passage_id":"call-notes:9","quote":"cohort data behind the 118% NRR figure","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The company has 11 months of runway and only $600k of the $2.5M soft-circled, so the round is not substantially committed.","basis":"stated","citations":[{"passage_id":"call-notes:8","quote":"They have $600k soft-circled from an energy angel syndicate. Runway at current burn is 11 months without the raise.","status":"ok"}],"verification":{"status":"verified","issues":[]}},{"text":"The plan requires going from six to 20 paying utilities and $1.5M ARR by December 2027 with one new utility sales lead, and no pipeline evidence is in the inputs.","basis":"absence","citations":[{"passage_id":"deck:8","quote":"Use of funds: three engineers, two implementation specialists, one utility sales lead. Target is 20 paying utilities and $1.5M ARR by December 2027.","status":"ok"}],"verification":{"status":"verified","issues":[]}}]},"integrity_notes":["No text in the inputs attempts to instruct the reviewer or an AI system on how to write this assessment.","Priya's \"better than even\" odds on both pilots converting is a founder's self-assessed probability, not evidence; the deck's Q4 2026 conversion language is more definite than what she would commit to on the call.","The website's customer outcome figures (Cascade PUD 31 days to 9 days; Three Rivers eliminating a 240-application backlog) are company-published marketing claims; reference calls with both accounts are still open follow-ups.","The $600k soft-circled from an energy angel syndicate is uncommitted by definition and was not documented in the inputs.","The 11-month runway figure is a fact about the company's position, not a reason to move faster; it should not be read as deal urgency.","Figures including $38k MRR, 118% NRR, 81% gross margin, the 410-utility serviceable market and the 12,000 applications processed are all company-provided and unaudited in these inputs; only the $38k MRR was explicitly confirmed in the call."]},"verification":[{"id":"d0.c0","where":"Team","section":"dimension","text":"Priya Raman spent eight years at PG&E and managed the distribution interconnection group from 2021, overseeing 14 engineers and analysts.","basis":"stated","citations":[{"passage_id":"founders:1","quote":"manager of the distribution interconnection group from 2021, overseeing a team of 14 engineers and analysts","status":"ok"},{"passage_id":"deck:7","quote":"Priya Raman (CEO) spent eight years at Pacific Gas & Electric, the last three running the distribution interconnection group.","status":"ok"}],"status":"verified","issues":[]},{"id":"d0.c1","where":"Team","section":"dimension","text":"Daniel Okafor was a forward-deployed engineer at Palantir from 2017 to 2022 and a staff engineer at Camus Energy from 2022 to 2024 building grid data integrations for cooperative u
